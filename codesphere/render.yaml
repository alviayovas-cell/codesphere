services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Web Service (Backend)
  # ---------------------------------------------------------------------------
  - type: web
    name: codesphere-backend
    runtime: python
    rootDir: codesphere/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard (MongoDB Atlas connection string)
      - key: MONGODB_DATABASE
        value: codesphere
      - key: REDIS_URL
        sync: false # Set in Render Dashboard (Redis connection string)
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure 256-bit random string
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: JUDGE0_URL
        value: https://ce.judge0.com # Or your self-hosted / RapidAPI Judge0 instance
      - key: CORS_ORIGINS
        sync: false # Set to your actual frontend Render URL after frontend creation

  # ---------------------------------------------------------------------------
  # 2. RQ Background Worker (Code Execution & Grading)
  # ---------------------------------------------------------------------------
  - type: worker
    name: codesphere-worker
    runtime: python
    rootDir: codesphere/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.run_worker
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        fromService:
          type: web
          name: codesphere-backend
          envVarKey: MONGODB_URI
      - key: MONGODB_DATABASE
        value: codesphere
      - key: REDIS_URL
        fromService:
          type: web
          name: codesphere-backend
          envVarKey: REDIS_URL
      - key: JWT_SECRET
        fromService:
          type: web
          name: codesphere-backend
          envVarKey: JWT_SECRET
      - key: JUDGE0_URL
        fromService:
          type: web
          name: codesphere-backend
          envVarKey: JUDGE0_URL

  # ---------------------------------------------------------------------------
  # 3. React Frontend (Static Site with SPA routing rewrite)
  # ---------------------------------------------------------------------------
  - type: web
    name: codesphere-frontend
    runtime: static
    rootDir: codesphere/frontend
    buildCommand: npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your actual backend Render URL, e.g. https://codesphere-backend.onrender.com
