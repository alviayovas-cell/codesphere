server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing - any path that isn't a real
    # static file falls back to index.html so deep links (e.g.
    # /student/rounds/abc) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fonts/JS/CSS are content-hashed by Vite, safe to cache aggressively.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
