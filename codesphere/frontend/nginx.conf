server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing - any path that isn't a real
    # static file falls back to index.html so deep links (e.g.
    # /student/rounds/abc) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy: the frontend calls a relative /api path (see
    # docker-compose.yml's VITE_API_URL=/api), so the browser never needs to
    # know the host's real IP/hostname - it just hits whatever origin it
    # loaded the page from, and nginx forwards that to the backend service on
    # the internal Docker network. This is what makes the bundle work
    # unchanged from any LAN IP (no rebuild needed if the host's address
    # changes between events).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;
    }

    # Fonts/JS/CSS are content-hashed by Vite, safe to cache aggressively.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
