# Self-contained production-style stack: mongo + redis + backend API +
# N RQ workers + frontend. Good for a single-VM/self-hosted deployment or a
# staging environment. For a real event, prefer pointing MONGODB_URI /
# REDIS_URL at managed services instead (MongoDB Atlas, a managed Redis) -
# just override those two env vars and drop the `mongo`/`redis` services
# below; nothing else in the app needs to change. See the root README's
# "Production Deployment" section for the full checklist.
#
# Usage:
#   cp backend/.env.example backend/.env   # then fill in real values
#   docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.workers.run_worker"]
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Scale this to add grading throughput, e.g.: docker compose up --scale worker=6
    # 4 replicas here is sized for a ~30-student contest (see
    # judge0-selfhosted/judge0.conf's COUNT comment for the paired Judge0-side
    # math) - each replica processes one submission at a time but fans out to
    # up to 8 concurrent Judge0 calls for that submission's test cases
    # (backend/app/workers/jobs.py), so this is the main lever for how many
    # students' Submit/Run get graded in parallel during a simultaneous burst
    # (e.g. everyone auto-submitting at round end).
    deploy:
      replicas: 4

  frontend:
    build:
      context: ./frontend
      args:
        # Relative path, not an absolute host/IP: nginx (see frontend/nginx.conf)
        # proxies /api same-origin to the backend service. This means the
        # built image works from any LAN IP/hostname unchanged - no rebuild
        # if the host machine's address is different at the next event.
        # Override with an absolute URL only if frontend and backend are
        # deployed to genuinely different origins (e.g. separate hosts).
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
