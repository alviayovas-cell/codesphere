services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Web Service (Backend) - also runs the RQ worker inline (see
  #    RUN_WORKER_INLINE below), since Render's free plan doesn't offer
  #    Background Worker services at all (paid plans only). If you upgrade
  #    later and want a real separate worker process, add a `type: worker`
  #    service back (same build/start command pattern as this one, but
  #    `startCommand: python -m app.workers.run_worker`) and delete/set
  #    RUN_WORKER_INLINE to false here so jobs aren't processed twice.
  # ---------------------------------------------------------------------------
  - type: web
    name: codesphere-backend
    runtime: python
    plan: free
    rootDir: codesphere/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RUN_WORKER_INLINE
        value: "true"
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard (MongoDB Atlas connection string)
      - key: MONGODB_DATABASE
        value: codesphere
      - key: REDIS_URL
        sync: false # Set in Render Dashboard (Redis connection string)
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure 256-bit random string
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: JUDGE0_URL
        value: https://ce.judge0.com # Or your self-hosted / RapidAPI Judge0 instance
      - key: CORS_ORIGINS
        sync: false # Set to your actual frontend Render URL after frontend creation

  # ---------------------------------------------------------------------------
  # 2. React Frontend (Static Site with SPA routing rewrite)
  # ---------------------------------------------------------------------------
  - type: web
    name: codesphere-frontend
    runtime: static
    rootDir: codesphere/frontend
    buildCommand: npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your actual backend Render URL, e.g. https://codesphere-backend.onrender.com
